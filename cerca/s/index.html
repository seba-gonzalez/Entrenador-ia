<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020606">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>CERCA</title>
<link rel="preload" href="/fonts/archivo-variable-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/alumno/cerca-alumno.css">
</head>
<body>

<main class="app" id="app">
  <div class="fallo">
    <h1 class="r-sesion">Abriendo tu sesión…</h1>
    <p class="r-lectura">Un momento.</p>
  </div>
</main>

<div id="flotantes" hidden>
  <button class="flota" id="fabCrono" type="button" aria-label="Cronómetro">⏱</button>
  <button class="flota" id="fabChat" type="button" aria-label="Escribirle a CERCA">✦</button>
</div>

<div class="hoja" id="hojaCrono">
  <div class="hoja-panel">
    <div class="hoja-cab">
      <strong class="r-bloque">Cronómetro</strong>
      <button class="cerrar" type="button" data-cerrar="hojaCrono" aria-label="Cerrar">✕</button>
    </div>
    <div class="crono-tiempo" id="cronoTiempo">00:30</div>
    <div class="crono-rotulo" id="cronoRotulo">PAUSA</div>
    <div class="presets">
      <button type="button" data-preset="20">20 s</button>
      <button type="button" data-preset="30">30 s</button>
      <button type="button" data-preset="45">45 s</button>
      <button type="button" data-preset="60">1:00</button>
      <button type="button" data-preset="90">1:30</button>
    </div>
    <div class="mandos">
      <button type="button" id="cronoCero">REINICIAR</button>
      <button type="button" id="cronoPausa">PAUSA</button>
      <button type="button" id="cronoVa" class="va">INICIAR</button>
    </div>
  </div>
</div>

<div class="hoja" id="hojaChat">
  <div class="hoja-panel">
    <div class="hoja-cab">
      <strong class="r-bloque">Escríbele a CERCA</strong>
      <button class="cerrar" type="button" data-cerrar="hojaChat" aria-label="Cerrar">✕</button>
    </div>
    <div class="chatlog" id="chatLog" data-saludo="Hola 👋 Estoy aprendiendo. Puedo ayudarte con algunas cosas simples de esta rutina. Si tienes una duda o te pasa algo mientras entrenas, escríbelo acá: aunque todavía no sepa responderte, queda anotado para que Seba lo revise."></div>
    <div class="estado r-apunte" id="bitEstado">Tus mensajes quedan anotados como bitácora de esta sesión.</div>
    <div class="atajos" id="atajos"></div>
    <div class="chat-fila">
      <input id="chatInput" maxlength="300" placeholder="Escribe tu duda…" autocomplete="off">
      <button id="chatEnviar" type="button">ENVIAR</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lggygnieziilvquvttby.supabase.co';

const VERSION_CLIENTE = 'reproductor-v1';
const FUENTE = 'vista_alumno_cerca_v1';
</script>
<script src="reproductor.js"></script>
</body>
</html>
